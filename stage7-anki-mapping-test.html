<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stage 7 Anki Mapping Test</title>
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      line-height: 1.8;
      margin: 2rem auto;
      max-width: 720px;
      padding: 0 1rem;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 1rem;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <h1>Stage 7 Mapping Check</h1>

  <div class="card">
    <strong>Mapped Candidate:</strong>
    <p>一方、今日は早く帰る予定です。</p>
    <p>その話にはもう一方の見方もあります。</p>
  </div>

  <div class="card">
    <strong>Unmapped Candidate:</strong>
    <p>その国の国土は南北に長いです。</p>
    <p>国土の気候は地域によって大きく異なります。</p>
  </div>
</body>
</html>
